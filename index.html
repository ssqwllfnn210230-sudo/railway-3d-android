
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Railway 3D</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8bc9f0;font-family:Arial,sans-serif;touch-action:none}
canvas{position:fixed;inset:0;display:block;width:100%;height:100%;z-index:0;touch-action:none}
#hud{position:fixed;inset:0;z-index:10;pointer-events:none;color:white}
#top{position:absolute;top:12px;left:12px;padding:10px 13px;background:#101820e8;border-radius:12px;font-size:14px;line-height:1.5}
#hint{position:absolute;top:70px;left:12px;right:165px;text-align:center;font-size:12px;text-shadow:0 2px 4px #000}
#cross{position:absolute;left:50%;top:50%;width:12px;height:12px;transform:translate(-50%,-50%);border:1px solid #ffffffa0;border-radius:50%}
button{font-family:Arial,sans-serif;font-size:14px;font-weight:bold;border:2px solid #ffffffaa;border-radius:12px;padding:13px 12px;background:#18242bf2;color:white;pointer-events:auto;touch-action:manipulation}
#actions{position:absolute;z-index:20;right:10px;top:12px;display:flex;flex-direction:column;align-items:flex-end;gap:10px;pointer-events:auto}
#mainBtn{display:block!important;visibility:visible!important;opacity:1!important;min-width:145px;min-height:54px;background:#ffc328;color:#151515;border:2px solid white;font-size:15px;box-shadow:0 3px 12px #0008}
#boomBtns{display:flex;flex-direction:column;align-items:flex-end;gap:7px}
#stick{position:absolute;left:20px;bottom:26px;width:118px;height:118px;border-radius:50%;background:#ffffff35;border:2px solid #ffffffa0;pointer-events:auto;touch-action:none}
#knob{position:absolute;left:33px;top:33px;width:48px;height:48px;border-radius:50%;background:#ffffffd9;border:2px solid white}
#footer{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:10px;text-shadow:0 1px 3px #000}
@media(max-height:480px){
 #actions{top:5px;right:5px;gap:4px}
 #mainBtn{min-height:42px;padding:8px}
 #boomBtns{flex-direction:row;flex-wrap:wrap;justify-content:flex-end}
 #stick{width:95px;height:95px;left:12px;bottom:12px}
 #knob{left:24px;top:24px}
 #hint{top:62px}
}
</style>
</head>
<body>
<div id="hud">
 <div id="top">🚧 RAILWAY 3D<br><span id="mode">Режим: багр</span></div>
 <div id="hint">Загрузка мира…</div>
 <div id="cross"></div>
 <div id="stick"><div id="knob"></div></div>
 <div id="actions">
  <button id="mainBtn" type="button">🚶 ВЫЙТИ ИЗ БАГРА</button>
  <div id="boomBtns">
   <button id="turnBtn" type="button">↻ Поворот</button>
   <button id="upBtn" type="button">⬆ Ковш</button>
   <button id="downBtn" type="button">⬇ Ковш</button>
  </div>
 </div>
 <div id="footer">Джойстик — движение · Палец справа — обзор</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(()=>{
const hint=document.getElementById('hint');
const mainBtn=document.getElementById('mainBtn');
const boomBtns=document.getElementById('boomBtns');
if(!window.THREE){hint.textContent='Нет 3D-библиотеки. Проверь интернет.';return}
try{
const T=THREE;
const scene=new T.Scene();
scene.background=new T.Color(0x8bc9f0);
scene.fog=new T.Fog(0x8bc9f0,60,190);
const camera=new T.PerspectiveCamera(75,innerWidth/innerHeight,.1,400);
const renderer=new T.WebGLRenderer({antialias:false,powerPreference:'low-power'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.domElement.style.zIndex='0';
document.body.insertBefore(renderer.domElement,document.body.firstChild);

scene.add(new T.HemisphereLight(0xe4f4ff,0x686047,2));
const sun=new T.DirectionalLight(0xffedc5,2.1);
sun.position.set(-15,30,-12);scene.add(sun);

const material=(c)=>new T.MeshStandardMaterial({color:c,roughness:.9});
const grass=material(0x577b42),rail=material(0x858c90),sleeper=material(0x574432);
const yellow=material(0xf3b51b),black=material(0x242729);
const glass=new T.MeshBasicMaterial({color:0x83d8f5,transparent:true,opacity:.35,side:T.DoubleSide});
function box(p,x,y,z,w,h,d,m){
 const o=new T.Mesh(new T.BoxGeometry(w,h,d),m);
 o.position.set(x,y,z);p.add(o);return o;
}
function cylinder(p,x,y,z,r,h,m,segments=10){
 const o=new T.Mesh(new T.CylinderGeometry(r,r,h,segments),m);
 o.position.set(x,y,z);p.add(o);return o;
}

// Земля и пути
box(scene,0,-.35,50,100,.5,300,grass);
box(scene,0,-.08,50,4.5,.15,300,material(0x79766c));
for(let z=-100;z<250;z+=1.35){
 box(scene,0,.02,z,3.1,.13,.25,sleeper);
}
for(const x of [-.72,.72]){
 box(scene,x,.14,50,.14,.2,300,rail);
 box(scene,x,.25,50,.055,.025,300,material(0xd0d4d5));
}
// Щебень
const stoneMats=[material(0x77776e),material(0x929087),material(0x66685f)];
for(let i=0;i<400;i++){
 const stone=new T.Mesh(new T.DodecahedronGeometry(.1+Math.random()*.12),stoneMats[i%3]);
 stone.position.set((Math.random()-.5)*4,.06,-30+Math.random()*200);
 scene.add(stone);
}
// Деревья
for(let z=-30;z<220;z+=5){
 for(const side of [-1,1]){
  const x=side*(5+Math.random()*7),h=3+Math.random()*3;
  cylinder(scene,x,h/2,z,.17,h,material(0x644832),7);
  const crown=new T.Mesh(new T.ConeGeometry(1.1+Math.random()*.5,h*.45,7),material(0x315c35));
  crown.position.set(x,h*.82,z);scene.add(crown);
 }
}

// Багр
const vehicle=new T.Group();scene.add(vehicle);
box(vehicle,0,.65,0,2.4,.45,2.8,yellow);
box(vehicle,0,.37,0,2.65,.25,3,black);
for(const x of [-1.12,1.12]){
 for(const z of [-.85,.85]){
  const w=cylinder(vehicle,x,.4,z,.4,.25,black,12);
  w.rotation.z=Math.PI/2;
 }
}
box(vehicle,0,1.3,-.35,1.5,1.1,1.3,yellow);
box(vehicle,0,1.9,-.35,1.6,.12,1.5,black);
box(vehicle,-.76,1.4,-.35,.08,.95,1.45,black);
box(vehicle,.76,1.4,-.35,.08,.95,1.45,black);
box(vehicle,0,1.4,-1.07,1.42,.85,.04,glass);
box(vehicle,0,1.4,.37,1.42,.85,.04,glass);
box(vehicle,-.79,1.4,-.35,.04,.85,1.35,glass);
box(vehicle,.79,1.4,-.35,.04,.85,1.35,glass);

// Стрела и ковш
const boom=new T.Group();boom.position.set(0,1.05,.4);vehicle.add(boom);
const arm=box(boom,0,.05,.85,.3,.3,1.8,yellow);arm.rotation.x=-.35;
const stick=new T.Group();stick.position.set(0,-.2,1.55);boom.add(stick);
const arm2=box(stick,0,0,.65,.22,.22,1.35,yellow);arm2.rotation.x=.15;
const bucket=new T.Group();bucket.position.set(0,-.2,1.3);stick.add(bucket);
box(bucket,0,-.08,.05,.43,.28,.36,black);
box(bucket,0,-.24,.2,.4,.1,.28,rail);

// Игрок и режимы
const player={x:0,y:1.55,z:-1.2};
let mode='vehicle',yaw=Math.PI,pitch=-.03;
let joyX=0,joyY=0,boomAngle=0,bucketAngle=0;
let lookId=null,lastX=0,lastY=0;
function updateMode(){
 document.getElementById('mode').textContent=mode==='vehicle'?'Режим: багр':'Режим: пешком';
 mainBtn.textContent=mode==='vehicle'?'🚶 ВЫЙТИ ИЗ БАГРА':'🚜 СЕСТЬ В БАГР';
 boomBtns.style.display=mode==='vehicle'?'flex':'none';
 hint.textContent=mode==='vehicle'?'Нажми «Выйти из багра», чтобы ходить по путям.':'Ты пешком. Подойди к багру и нажми «Сесть в багр».';
}
mainBtn.addEventListener('click',()=>{
 if(mode==='vehicle'){
  player.x=vehicle.position.x+2.8;
  player.z=vehicle.position.z;
  yaw=Math.PI;pitch=0;
  mode='foot';
 }else{
  const distance=Math.hypot(player.x-vehicle.position.x,player.z-vehicle.position.z);
  if(distance<5.5){
   player.x=vehicle.position.x;
   player.z=vehicle.position.z-1.1;
   mode='vehicle';
  }else{
   hint.textContent='Подойди ближе к жёлтому багру, чтобы сесть.';
  }
 }
 updateMode();
});
document.getElementById('turnBtn').addEventListener('click',()=>{if(mode==='vehicle')boomAngle+=.15});
document.getElementById('upBtn').addEventListener('click',()=>{if(mode==='vehicle')bucketAngle=Math.min(.7,bucketAngle+.12)});
document.getElementById('downBtn').addEventListener('click',()=>{if(mode==='vehicle')bucketAngle=Math.max(-.7,bucketAngle-.12)});

// Джойстик
const pad=document.getElementById('stick'),knob=document.getElementById('knob');
let stickId=null;
function moveJoy(e){
 const r=pad.getBoundingClientRect();
 let dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2;
 const len=Math.hypot(dx,dy),max=34;
 if(len>max){dx*=max/len;dy*=max/len}
 joyX=dx/max;joyY=dy/max;
 knob.style.transform=`translate(${dx}px,${dy}px)`;
}
pad.addEventListener('pointerdown',e=>{e.preventDefault();stickId=e.pointerId;pad.setPointerCapture(e.pointerId);moveJoy(e)});
pad.addEventListener('pointermove',e=>{if(e.pointerId===stickId)moveJoy(e)});
function release(e){
 if(e.pointerId!==stickId)return;
 stickId=null;joyX=joyY=0;knob.style.transform='';
}
pad.addEventListener('pointerup',release);
pad.addEventListener('pointercancel',release);

// Обзор пальцем по миру
renderer.domElement.addEventListener('pointerdown',e=>{
 if(e.clientX<innerWidth*.36)return;
 lookId=e.pointerId;lastX=e.clientX;lastY=e.clientY;
 renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener('pointermove',e=>{
 if(e.pointerId!==lookId)return;
 yaw-=(e.clientX-lastX)*.006;
 pitch-=(e.clientY-lastY)*.005;
 pitch=Math.max(-1.15,Math.min(1.15,pitch));
 lastX=e.clientX;lastY=e.clientY;
});
function endLook(e){if(e.pointerId===lookId)lookId=null}
renderer.domElement.addEventListener('pointerup',endLook);
renderer.domElement.addEventListener('pointercancel',endLook);

// Простые облака
for(let i=0;i<8;i++){
 const cloud=new T.Group();
 for(let j=0;j<4;j++){
  const c=new T.Mesh(new T.SphereGeometry(.55,8,6),new T.MeshBasicMaterial({color:0xf6f8fa}));
  c.position.set(j*.6,(j%2)*.12,0);cloud.add(c);
 }
 cloud.position.set(-20+i*6,12+i%3,-20-i*7);scene.add(cloud);
}
let last=performance.now();
function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min((now-last)/1000,.04);last=now;
 if(mode==='foot'){
  const forward=-joyY;
  const side=joyX;
  player.x+=(Math.cos(yaw)*side+Math.sin(yaw)*forward)*5*dt;
  player.z+=(Math.sin(yaw)*side-Math.cos(yaw)*forward)*5*dt;
  player.x=Math.max(-25,Math.min(25,player.x));
  player.y=1.65;
 }else{
  vehicle.position.x+=joyX*dt*1.8;
  vehicle.position.z+=joyY*dt*1.8;
  player.x=vehicle.position.x;
  player.z=vehicle.position.z-1.15;
  boom.rotation.y=boomAngle;
  stick.rotation.x=bucketAngle;
 }
 camera.position.set(player.x,player.y,player.z);
 camera.rotation.order='YXZ';
 camera.rotation.set(pitch,yaw,0);
 renderer.render(scene,camera);
}
addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
updateMode();
requestAnimationFrame(animate);
}catch(e){
 hint.textContent='Ошибка 3D: '+e.message;
}
})();
</script>
</body>
</html>
